# JfireBoot 应用配置文件示例
# 注意：Jfire 读取配置需要在 @Configuration 类上使用 @PropertyPath 指定路径

# 数据库配置（示例，实际配置在 AppConfig.dataSource() 中）
database:
  url: jdbc:mysql://localhost:3306/mydb
  username: root
  password: password
  driver: com.mysql.cj.jdbc.Driver

# 应用配置
app:
  name: JfireBoot Application
  version: 1.0.0
  port: 8080

# 日志配置（需要配合 log4j2.xml）
logging:
  level: INFO
